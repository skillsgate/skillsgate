appId: ai.skillsgate.desktop
productName: SkillsGate
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - "!node_modules"
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/prebuild-install/**/*
npmRebuild: true
asarUnpack:
  - "**/*.node"
extraMetadata:
  main: out/main/index.js

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Builds are signed with Developer ID but not notarized. Notarization needs
  # an active Apple Developer Program membership; without one the notary
  # service answers 403 and the build fails. Set back to true once a
  # membership is active again.
  notarize: false

win:
  target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # No spaces: latest.yml references this exact name, and GitHub rewrites
  # spaces in uploaded asset names to dots, which breaks Windows updates.
  artifactName: "SkillsGate-Setup-${version}.${ext}"

linux:
  target:
    - AppImage
    - deb
  category: Development
  # Without this the Linux executable is named after the npm package
  # (@skillsgate/desktop -> "@skillsgatedesktop"), which electron-builder 26.15
  # and later reject. On upgrade, the old deb's postrm removes the
  # /usr/bin/@skillsgatedesktop link and AppArmor profile, and the new postinst
  # installs these under the new name.
  executableName: skillsgate
  artifactName: "SkillsGate-${version}-${arch}.${ext}"

publish:
  provider: github
  owner: skillsgate
  repo: skillsgate
