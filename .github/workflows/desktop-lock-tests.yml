name: Desktop lock tests

on:
  pull_request:
    paths:
      - "apps/desktop/src/main/**"
      - "apps/desktop/tests/skill-lock*.test.ts"
      - "apps/desktop/package.json"
      - ".github/workflows/desktop-lock-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/src/main/**"
      - "apps/desktop/tests/skill-lock*.test.ts"
      - "apps/desktop/package.json"
      - ".github/workflows/desktop-lock-tests.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - run: npm run test:lock -w @skillsgate/desktop
