name: Publish Desktop App

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
          - os: macos-14
            platform: mac
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: ""
          - os: windows-latest
            platform: win
            arch: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Use npm install (not npm ci) to ensure platform-specific optional deps install correctly
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-package-lock
        shell: bash

      # Read the Electron version from the app manifest so this can never drift
      # from the `electron` devDependency the app is actually built against.
      - name: Resolve Electron version
        id: electron
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').devDependencies.electron")"
          if [[ -z "$version" || "$version" == "undefined" ]]; then
            echo "Could not read the electron devDependency from apps/desktop/package.json" >&2
            exit 1
          fi
          echo "Building against Electron $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rebuild native modules for Electron
        shell: bash
        run: npx electron-rebuild -v "${{ steps.electron.outputs.version }}" -m node_modules/better-sqlite3 ${{ matrix.arch && format('-a {0}', matrix.arch) || '' }}

      - name: Build and package desktop app
        shell: bash
        run: |
          set -euo pipefail
          package_cmd="npm run package:${{ matrix.platform }} -w @skillsgate/desktop -- ${{ matrix.arch && format('--{0}', matrix.arch) || '' }}"

          if [[ "${{ matrix.platform }}" != "mac" ]]; then
            eval "$package_cmd"
            exit 0
          fi

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "macOS packaging attempt $attempt/$max_attempts"
            if eval "$package_cmd"; then
              exit 0
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "macOS packaging failed after $max_attempts attempts"
              exit 1
            fi

            retry_delay=$((attempt * 30))
            echo "Retrying macOS packaging after ${retry_delay}s to work around transient notarization/network failures"
            sleep "$retry_delay"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Both macOS matrix jobs emit their own latest-mac.yml listing only their
      # own artifacts. The publish job downloads everything with
      # merge-multiple: true, so identically named manifests would clobber each
      # other and the survivor would advertise a single architecture. Give each
      # one an arch-specific name; the publish job merges them back together.
      - name: Disambiguate macOS update manifest
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          src="apps/desktop/release/latest-mac.yml"
          if [[ ! -f "$src" ]]; then
            echo "Expected $src to exist after packaging" >&2
            exit 1
          fi
          mv "$src" "apps/desktop/release/latest-mac-${{ matrix.arch }}.yml"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Rebuild a single latest-mac.yml listing every macOS artifact from both
      # matrix jobs, so electron-updater hands arm64 Macs the arm64 build.
      # Windows (latest.yml) and Linux (latest-linux.yml) manifests are built by
      # a single job each and are left untouched.
      - name: Merge macOS update manifests
        shell: bash
        run: |
          set -euo pipefail
          # Install js-yaml into a scratch dir so we don't have to install the
          # whole monorepo (and run its native-module postinstall) in this job.
          yaml_dir="$RUNNER_TEMP/yaml-tools"
          mkdir -p "$yaml_dir"
          npm install --prefix "$yaml_dir" --no-save --no-package-lock --ignore-scripts js-yaml
          NODE_PATH="$yaml_dir/node_modules" node .github/scripts/merge-mac-manifests.mjs artifacts
          echo "--- merged latest-mac.yml ---"
          cat artifacts/latest-mac.yml
        env:
          # Darwin kernel version of the oldest macOS the bundled Electron
          # supports. Electron 42 requires macOS 12 (Darwin 21); Electron 44
          # will raise that to macOS 13 (Darwin 22). Bump this when a future
          # Electron raises its macOS floor. electron-updater on older Macs
          # will then skip the update instead of installing an app that
          # cannot launch.
          MAC_MINIMUM_SYSTEM_VERSION: "21.0.0"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
